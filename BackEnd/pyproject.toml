[project]
name = "backend"
version = "0.1.0"
description = "Kartabya backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi[standard]>=0.141.1",
    "openai>=2.53.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
]
