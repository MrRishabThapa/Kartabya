<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kartabya Local Auth Tester</title>
    <style>
      body { font: 16px system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
      form { display: grid; gap: .75rem; margin: 1rem 0 2rem; }
      input, button { font: inherit; padding: .65rem; }
      button { cursor: pointer; }
      pre { white-space: pre-wrap; background: #f3f4f6; padding: 1rem; }
    </style>
  </head>
  <body>
    <h1>Kartabya local auth</h1>
    <p>Use this page to test email/password signup and login against the API.</p>

    <form id="auth-form">
      <input id="name" placeholder="Name (signup only)" autocomplete="name" />
      <input id="email" type="email" placeholder="Email" autocomplete="email" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <div>
        <button type="button" id="signup">Sign up</button>
        <button type="submit">Log in</button>
        <button type="button" id="me">Get me</button>
        <button type="button" id="logout">Log out</button>
      </div>
    </form>
    <pre id="result">Ready.</pre>

    <script>
      const result = document.querySelector("#result");
      const value = (id) => document.querySelector(id).value;
      async function call(path, options = {}) {
        const response = await fetch(path, { credentials: "include", ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
        const body = await response.json();
        result.textContent = JSON.stringify(body, null, 2);
      }
      document.querySelector("#signup").onclick = () => call("/api/v1/auth/signup", {
        method: "POST", body: JSON.stringify({ email: value("#email"), password: value("#password"), name: value("#name") || null })
      });
      document.querySelector("#auth-form").onsubmit = (event) => {
        event.preventDefault();
        return call("/api/v1/auth/login", {
          method: "POST", body: JSON.stringify({ email: value("#email"), password: value("#password") })
        });
      };
      document.querySelector("#me").onclick = () => call("/api/v1/auth/me");
      document.querySelector("#logout").onclick = () => call("/api/v1/auth/logout", { method: "POST" });
    </script>
  </body>
</html>
